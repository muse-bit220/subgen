name: SubGen
options:
  bundleIdPrefix: com.aramaki
  deploymentTarget:
    iOS: 18.0
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.0.0
targets:
  SubGen:
    type: application
    platform: iOS
    sources:
      - path: SubGen
    info:
      path: SubGen/Info.plist
      properties:
        CFBundleDisplayName: SubGen 字幕
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aramaki.subgen
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
